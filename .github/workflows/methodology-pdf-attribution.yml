name: Apply methodology PDF authorship attribution

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_methodology_pdf_attribution.py"
      - ".github/workflows/methodology-pdf-attribution.yml"

permissions:
  contents: write

jobs:
  update-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tooling
        run: pip install --disable-pip-version-check pypdf reportlab
      - name: Apply authorship attribution
        run: python scripts/apply_methodology_pdf_attribution.py
      - name: Verify PDF page counts
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          files = list(Path("public/methodology").glob("CheckOpp_Methodology_Public_Summary_*_v1.0_September_2026.pdf"))
          assert len(files) == 4, files
          for path in files:
              pages = len(PdfReader(str(path)).pages)
              assert pages == 4, (path, pages)
              print(path.name, pages)
          PY
      - name: Commit updated PDFs
        run: |
          if git diff --quiet -- public/methodology/*.pdf; then
            echo "No PDF changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/methodology/*.pdf
          git commit -m "Add methodology authorship attribution to public PDFs"
          git push origin HEAD:main
